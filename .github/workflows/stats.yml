name: Generate GitHub Stats

on:
  schedule:
    - cron: "15 0 * * *"
  push:
    paths:
      - ".github/workflows/stats.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with main
        run: git pull --rebase origin main

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=FarrukhGul&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=6AD3F5&icon_color=6AD3F5&text_color=ffffff
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=FarrukhGul&theme=tokyonight&hide_border=true&layout=compact&bg_color=0D1117&title_color=6AD3F5&text_color=ffffff&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Streak Stats
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=FarrukhGul&theme=tokyonight&hide_border=true&background=0D1117&ring=6AD3F5&fire=6AD3F5&currStreakLabel=6AD3F5&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/streak.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo "No stats changes to commit."
            exit 0
          fi
          git commit -m "chore: update GitHub stats cards"
          git push origin HEAD:main
